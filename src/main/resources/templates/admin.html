<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <span class="navbar-brand text-white">

            <b sec:authentication="name"></b>

            with roles:

            <span sec:authentication="authorities"></span>

        </span>

        <form th:action="@{/logout}" method="post">

            <button type="submit"
                    class="btn btn-outline-light">

                Logout

            </button>

        </form>

    </div>

</nav>


<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 p-0">

            <div class="nav flex-column nav-pills pt-4">

                <a class="nav-link active"
                   href="/admin">

                    Admin

                </a>

                <a class="nav-link"
                   href="/user">

                    User

                </a>

            </div>

        </div>


        <div class="col-md-10 p-4 bg-light">

            <h2 class="mb-4">
                Admin Panel
            </h2>


            <ul class="nav nav-tabs">

                <li class="nav-item">

                    <button class="nav-link active"
                            type="button"
                            data-bs-toggle="tab"
                            data-bs-target="#users">

                        Users Table

                    </button>

                </li>


                <li class="nav-item">

                    <button class="nav-link"
                            type="button"
                            data-bs-toggle="tab"
                            data-bs-target="#new">

                        New User

                    </button>

                </li>

            </ul>


            <div class="tab-content">


                <!-- USERS TABLE -->

                <div class="tab-pane fade show active"
                     id="users">

                    <h4 class="mt-4 mb-3">
                        All users
                    </h4>


                    <div class="table-responsive">

                        <table class="table table-striped table-hover bg-white">

                            <thead class="table-light">

                            <tr>

                                <th>ID</th>
                                <th>Name</th>
                                <th>Last name</th>
                                <th>Age</th>
                                <th>Roles</th>
                                <th>Edit</th>
                                <th>Delete</th>

                            </tr>

                            </thead>


                            <tbody>

                            <tr th:each="user : ${users}">

                                <td th:text="${user.id}">
                                </td>

                                <td th:text="${user.userName}">
                                </td>

                                <td th:text="${user.lastName}">
                                </td>

                                <td th:text="${user.age}">
                                </td>


                                <td>

                                    <span th:each="role : ${user.roles}"
                                          class="badge bg-secondary me-1"
                                          th:text="${#strings.replace(role.name, 'ROLE_', '')}">
                                    </span>

                                </td>


                                <td>

                                    <button type="button"
                                            class="btn btn-primary btn-sm"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#editModal' + ${user.id}">

                                        Edit

                                    </button>

                                </td>


                                <td>

                                    <button type="button"
                                            class="btn btn-danger btn-sm"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#deleteModal' + ${user.id}">

                                        Delete

                                    </button>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>


                <!-- NEW USER -->

                <div class="tab-pane fade"
                     id="new">

                    <div class="row justify-content-center">

                        <div class="col-md-6">

                            <h4 class="mt-4 mb-4 text-center">
                                Add new user
                            </h4>


                            <form th:action="@{/admin/add}"
                                  method="post">


                                <div class="mb-3">

                                    <label class="form-label">
                                        User name
                                    </label>

                                    <input type="text"
                                           name="userName"
                                           class="form-control"
                                           required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label">
                                        Last name
                                    </label>

                                    <input type="text"
                                           name="lastName"
                                           class="form-control"
                                           required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label">
                                        Age
                                    </label>

                                    <input type="number"
                                           name="age"
                                           class="form-control"
                                           required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           name="password"
                                           class="form-control"
                                           required>

                                </div>


                                <div class="mb-3">

                                    <label class="form-label">
                                        Roles
                                    </label>

                                    <select name="roles"
                                            class="form-select"
                                            multiple
                                            required>

                                        <option th:each="role : ${allRoles}"
                                                th:value="${role.name}"
                                                th:text="${#strings.replace(role.name, 'ROLE_', '')}">
                                        </option>

                                    </select>

                                </div>


                                <div class="text-center">

                                    <button type="submit"
                                            class="btn btn-success">

                                        Add new user

                                    </button>

                                </div>


                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- EDIT MODALS -->

<th:block th:each="user : ${users}">

    <div class="modal fade"
         th:id="'editModal' + ${user.id}"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Edit user
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <form th:action="@{/admin/update}"
                          method="post">


                        <input type="hidden"
                               name="id"
                               th:value="${user.id}">


                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   name="userName"
                                   th:value="${user.userName}"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Last name
                            </label>

                            <input type="text"
                                   name="lastName"
                                   th:value="${user.lastName}"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Age
                            </label>

                            <input type="number"
                                   name="age"
                                   th:value="${user.age}"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Roles
                            </label>


                            <div th:each="role : ${allRoles}"
                                 class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       name="roles"
                                       th:value="${role.name}"
                                       th:checked="${user.roles.contains(role)}">

                                <label class="form-check-label"
                                       th:text="${#strings.replace(role.name, 'ROLE_', '')}">
                                </label>

                            </div>

                        </div>


                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">

                                Edit

                            </button>


                            <button type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal">

                                Close

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- DELETE MODAL -->

    <div class="modal fade"
         th:id="'deleteModal' + ${user.id}"
         tabindex="-1"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Delete user
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <div class="mb-3">

                        <label class="form-label">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${user.id}"
                               disabled>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            User name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${user.userName}"
                               disabled>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Last name
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${user.lastName}"
                               disabled>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input type="number"
                               class="form-control"
                               th:value="${user.age}"
                               disabled>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Roles
                        </label>

                        <div>

                            <span th:each="role : ${user.roles}"
                                  class="badge bg-secondary me-1"
                                  th:text="${#strings.replace(role.name, 'ROLE_', '')}">
                            </span>

                        </div>

                    </div>


                </div>


                <div class="modal-footer">


                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Close

                    </button>


                    <form th:action="@{/admin/delete}"
                          method="post">

                        <input type="hidden"
                               name="id"
                               th:value="${user.id}">


                        <button type="submit"
                                class="btn btn-danger">

                            Delete

                        </button>

                    </form>


                </div>

            </div>

        </div>

    </div>

</th:block>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
